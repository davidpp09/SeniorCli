name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Un PR que recibe varios pushes seguidos solo corre el ultimo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  formato:
    name: Formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # SeniorCLI es una CLI multiplataforma: se prueba en los tres sistemas.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests unitarios y de integracion
        run: cargo test --all-features --verbose
      - name: Tests de documentacion
        run: cargo test --doc

  msrv:
    name: Version minima de Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Leer rust-version de Cargo.toml
        id: msrv
        run: echo "version=$(grep '^rust-version' Cargo.toml | cut -d '"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  docs:
    name: Documentacion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc sin enlaces rotos
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
