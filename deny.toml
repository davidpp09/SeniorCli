# Reglas de cargo-deny. Las revisa el workflow `Auditoria de dependencias`.

[advisories]
# Falla ante vulnerabilidades conocidas.
ignore = []

[licenses]
# Licencias aceptadas para un proyecto que se distribuye como binario.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Varias versiones del mismo crate inflan el binario; avisar sin bloquear.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
